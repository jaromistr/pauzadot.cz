<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stránka nenalezena · Page not found – pauza.</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <script>
    try { var t = localStorage.getItem('pauza.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- GitHub Pages ji ukáže pro každou neexistující adresu; obě řeči zároveň, bez šablony. -->
<header class="wrap top">
  <a class="logo" href="/">pauza<span class="dot">.</span></a>
</header>
<main class="wrap hero">
  <div>
    <h1>404<span class="dot">.</span></h1>
    <p class="claim">Tahle stránka tu není.</p>
    <p class="lead" lang="en">This page doesn’t exist.</p>
    <div class="cta">
      <a class="store" href="/"><strong>Na úvod</strong></a>
      <a class="ig" href="/en/" lang="en">Home (English)</a>
    </div>
  </div>
</main>
</body>
</html>
